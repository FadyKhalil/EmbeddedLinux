<svg xmlns="http://www.w3.org/2000/svg" class="el-svg" width="900" height="205" viewBox="0 0 900 205" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>
.el-svg:not(.el-inline){--el-fg:#1f2430;--el-muted:#5f6675;--el-box:#f4f5fb;--el-line:#9aa3b8;--el-accent:#ff5722;--el-accent-soft:#fff0e8;--el-primary:#3f51b5;--el-primary-soft:#e8eaf6;--el-ok:#2e7d32;--el-bad:#c62828}
@media (prefers-color-scheme:dark){.el-svg:not(.el-inline){--el-fg:#e6e8ee;--el-muted:#9aa1b0;--el-box:#262a36;--el-line:#5c6478;--el-accent:#ff7043;--el-accent-soft:#4a2c20;--el-primary:#7986cb;--el-primary-soft:#2b3152;--el-ok:#66bb6a;--el-bad:#ef5350}}
.el-svg .box{fill:var(--el-box);stroke:var(--el-line);stroke-width:1.5}
.el-svg .soft{fill:var(--el-primary-soft);stroke:var(--el-primary);stroke-width:1.5}
.el-svg .title{fill:var(--el-fg);font-size:15px;font-weight:600}
.el-svg .sub{fill:var(--el-muted);font-size:13px}
.el-svg .arrow{stroke:var(--el-line);stroke-width:2;fill:none}
.el-svg .ahead{fill:var(--el-line)}
.el-svg .accent{fill:var(--el-accent)}
.el-svg .band{fill:var(--el-primary);font-size:13px;font-weight:600}
.el-svg:not(.el-inline) .only-anim{display:none}
</style>
<defs>
<marker id="ah-boot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ahead"/></marker>
</defs>
<g class="only-anim" data-move="1:0,0 2:128,0 3:256,0 4:384,0 5:512,0 6:640,0 7:768,0"><path d="M51,40L75,40L63,58z" class="accent"/></g>
<g data-active="1"><rect class="box" x="8" y="70" width="110" height="64" rx="10"/><text class="title" x="63" y="98" text-anchor="middle">ROM code</text><text class="sub" x="63" y="118" text-anchor="middle">inside the SoC</text></g>
<line class="arrow" x1="120" y1="102" x2="134" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="2"><rect class="box" x="136" y="70" width="110" height="64" rx="10"/><text class="title" x="191" y="98" text-anchor="middle">SPL / MLO</text><text class="sub" x="191" y="118" text-anchor="middle">first stage</text></g>
<line class="arrow" x1="248" y1="102" x2="262" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="3"><rect class="box" x="264" y="70" width="110" height="64" rx="10"/><text class="title" x="319" y="98" text-anchor="middle">U-Boot</text><text class="sub" x="319" y="118" text-anchor="middle">Lesson 3</text></g>
<line class="arrow" x1="376" y1="102" x2="390" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="4"><rect class="box" x="392" y="70" width="110" height="64" rx="10"/><text class="title" x="447" y="98" text-anchor="middle">Kernel + DTB</text><text class="sub" x="447" y="118" text-anchor="middle">Lesson 4</text></g>
<line class="arrow" x1="504" y1="102" x2="518" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="5"><rect class="box" x="520" y="70" width="110" height="64" rx="10"/><text class="title" x="575" y="98" text-anchor="middle">Root FS</text><text class="sub" x="575" y="118" text-anchor="middle">Lesson 5</text></g>
<line class="arrow" x1="632" y1="102" x2="646" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="6"><rect class="box" x="648" y="70" width="110" height="64" rx="10"/><text class="title" x="703" y="98" text-anchor="middle">init (PID 1)</text><text class="sub" x="703" y="118" text-anchor="middle">Lesson 6</text></g>
<line class="arrow" x1="760" y1="102" x2="774" y2="102" marker-end="url(#ah-boot)"/>
<g data-active="7"><rect class="box" x="776" y="70" width="110" height="64" rx="10"/><text class="title" x="831" y="98" text-anchor="middle">Your app</text><text class="sub" x="831" y="118" text-anchor="middle">heartbeat</text></g>
<rect class="soft" x="264" y="158" width="622" height="32" rx="8"/>
<text class="band" x="575" y="179" text-anchor="middle">Cross toolchain (Lesson 2) builds U-Boot, the kernel, the root FS and your app</text>
</svg>
