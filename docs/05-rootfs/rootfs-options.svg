.el-svg .mono{fill:var(--el-fg);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.el-svg .arrow{stroke:var(--el-line);stroke-width:2;fill:none}
.el-svg .ahead{fill:var(--el-line)}
</style>
